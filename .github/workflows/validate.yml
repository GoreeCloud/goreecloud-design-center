name: Design Center validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DESIGN_CENTER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Design Center source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DESIGN_CENTER_SOURCE_REVISION }}
          persist-credentials: false

      - name: Verify exact Design Center source revision
        run: test "$(git rev-parse HEAD)" = "$DESIGN_CENTER_SOURCE_REVISION"

      - name: Check out pinned Platform Contract authority
        uses: actions/checkout@v4
        with:
          repository: GoreeCloud/GoreeCloud
          ref: dd7701b116d210a82ec0cb18ccb84b553b6e87e1
          path: .platform-contract
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Platform Contract validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0

      - name: Validate Platform Contract 0.2 declaration
        run: python .platform-contract/scripts/validate_platform_manifest.py goreecloud.platform.yaml

      - name: Build and validate Design Center
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-design-center-${{ env.DESIGN_CENTER_SOURCE_REVISION }}
          path: dist
          if-no-files-found: error
          retention-days: 14
